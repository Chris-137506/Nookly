    :root {

    }
    body {
      font-family: var(--font-sans);
      background-color: #FAFAFA;
      color: #0F172A;
      -webkit-font-smoothing: antialiased;
    }
    /* Hide scrollbar for tabs */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    @keyframes toastSlide {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    .animate-fade { animation: fadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-sheet { animation: slideUp 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-toast { animation: toastSlide 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  </style>
</head>

      const totalDownloads = MATERIALS.reduce((a, m) => a + m.downloadsCount, 0);

      } else if (state.role === 'contributor' && (state.tab === 'upload' || state.tab === 'submissions')) {
        main.innerHTML = renderContributorView();
      } else if (state.role === 'admin' && (state.tab === 'queue' || state.tab === 'analytics')) {
        main.innerHTML = renderAdminView();
      }
    }

    // Initial boot
    render();
  </script>
</body>
</html>
